services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: eventknit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventknit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventknit123}
      POSTGRES_DB: ${POSTGRES_DB:-eventknit}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eventknit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventknit} -d ${POSTGRES_DB:-eventknit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: eventknit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - eventknit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Backend Server (Development)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: eventknit-server
    restart: unless-stopped
    env_file: ./server/.env.development
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventknit}:${POSTGRES_PASSWORD:-eventknit123}@postgres:5432/${POSTGRES_DB:-eventknit}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
    networks:
      - eventknit-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: eventknit-client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    networks:
      - eventknit-network
    ports:
      - "5173:5173"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: eventknit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - eventknit-network
    depends_on:
      - server
      - client

networks:
  eventknit-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
