name: Server CI Pipeline

on:
  push:
    branches: [main, development, staging]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [main, development, staging]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

jobs:
  server-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup test environment
        run: |
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "MONGODB_URI=mongodb://localhost:27017/eventknit-test" >> $GITHUB_ENV
          echo "JWT_SECRET=test-secret-key-for-ci" >> $GITHUB_ENV
          echo "PORT=3001" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run server linter
        working-directory: ./server
        run: npm run lint

      - name: Run server type checking
        working-directory: ./server
        run: npm run type-check

      - name: Run server tests
        working-directory: ./server
        run: npm run test:coverage

      - name: Build server
        working-directory: ./server
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload server build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-build-files
          path: server/dist/

      - name: Upload server coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-report
          path: server/coverage/

