version: '3.8'

services:
  eventknit-server:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/eventknit}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - CORS_CREDENTIALS=${CORS_CREDENTIALS:-true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    depends_on:
      - mongodb
      - redis
    volumes:
      # Only mount source in development for hot reload
      - ${VOLUME_MOUNT_SRC:-./src}:/app/src
      - ./logs:/app/logs
    networks:
      - eventknit-network
    restart: ${RESTART_POLICY:-no}
    deploy:
      replicas: ${SERVER_REPLICAS:-1}
      resources:
        limits:
          memory: ${SERVER_MEMORY_LIMIT:-512M}
          cpus: '${SERVER_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${SERVER_MEMORY_RESERVATION:-256M}
          cpus: '${SERVER_CPU_RESERVATION:-0.25}'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:7.0
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-password}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE:-eventknit}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - eventknit-network
    restart: ${RESTART_POLICY:-no}
    deploy:
      resources:
        limits:
          memory: ${MONGODB_MEMORY_LIMIT:-1G}
          cpus: '${MONGODB_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${MONGODB_MEMORY_RESERVATION:-512M}
          cpus: '${MONGODB_CPU_RESERVATION:-0.5}'

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - eventknit-network
    restart: ${RESTART_POLICY:-no}
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256M}
          cpus: '${REDIS_CPU_LIMIT:-0.25}'
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION:-128M}
          cpus: '${REDIS_CPU_RESERVATION:-0.1}'

  # Only include mongo-express in development
  mongo-express:
    image: mongo-express:1.0.0
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USERNAME:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD:-password}
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - eventknit-network
    restart: ${RESTART_POLICY:-no}
    profiles:
      - dev

volumes:
  mongodb_data:
  redis_data:

networks:
  eventknit-network:
    driver: bridge