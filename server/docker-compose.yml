version: '3.8'

services:
  eventknit-server:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-postgresql://eventknit:eventknit123@postgres:5432/eventknit?schema=public}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret-key}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - AUTH_RATE_LIMIT_WINDOW_MS=${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-5}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - CORS_CREDENTIALS=${CORS_CREDENTIALS:-true}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@eventknit.com}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    depends_on:
      - postgres
      - redis
    volumes:
      # Only mount source in development for hot reload
      - ${VOLUME_MOUNT_SRC:-./src}:/app/src
      - ./logs:/app/logs
    networks:
      - eventknit-network
    restart: ${RESTART_POLICY:-no}
    deploy:
      replicas: ${SERVER_REPLICAS:-1}
      resources:
        limits:
          memory: ${SERVER_MEMORY_LIMIT:-512M}
          cpus: '${SERVER_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${SERVER_MEMORY_RESERVATION:-256M}
          cpus: '${SERVER_CPU_RESERVATION:-0.25}'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: eventknit-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-eventknit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eventknit123}
      - POSTGRES_DB=${POSTGRES_DB:-eventknit}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eventknit-network
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventknit} -d ${POSTGRES_DB:-eventknit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - eventknit-network
    restart: ${RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256M}
          cpus: '${REDIS_CPU_LIMIT:-0.25}'
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION:-128M}
          cpus: '${REDIS_CPU_RESERVATION:-0.1}'

  # Only include pgadmin in development
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eventknit-pgadmin
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@eventknit.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    depends_on:
      - postgres
    networks:
      - eventknit-network
    restart: ${RESTART_POLICY:-no}
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:

networks:
  eventknit-network:
    driver: bridge
