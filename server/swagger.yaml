  # ==================== WORKSTATION SCANNING ====================
  /workstation/scan:
    post:
      tags:
        - Service Point
      summary: Scan ticket for entry (check-in)
      description: |
        Scan a QR code or backup code to check in an attendee.
        Supports Ed25519 signed tickets, legacy HMAC tickets, and backup codes.
        Rate limited to 100 scans per minute per user, 200 per minute per IP.
      operationId: scanTicket
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - eventId
              properties:
                code:
                  type: string
                  description: QR code content or backup code
                  example: "eyJhbGciOiJFZERTQSIsInR5cCI6IlRLVCJ9.eyJyaWQiOiIxMjM0NSIsImVpZCI6ImV2dF8xMjMifQ.signature"
                eventId:
                  type: string
                  description: Event ID to validate against
                  example: "evt_xyz789"
                checkpointId:
                  type: string
                  description: Optional checkpoint/facility ID
                  example: "checkpoint_main_entrance"
                location:
                  type: object
                  description: Optional GPS coordinates
                  properties:
                    lat:
                      type: number
                      example: -1.2921
                    lng:
                      type: number
                      example: 36.8219
      responses:
        '200':
          description: Scan successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      scanId:
                        type: string
                      registrationId:
                        type: string
                      attendeeName:
                        type: string
                      ticketType:
                        type: string
                      scanType:
                        type: string
                        enum: [CHECK_IN, MANUAL_CHECK_IN]
                      scannedAt:
                        type: string
                        format: date-time
                      isReEntry:
                        type: boolean
                      signatureValid:
                        type: boolean
                      codeType:
                        type: string
                        enum: [QR_CODE, BACKUP_CODE]
        '400':
          description: Invalid ticket or scan error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    enum: [INVALID_SIGNATURE, WRONG_EVENT, INVALID_TICKET, ALREADY_SCANNED, REENTRY_NOT_ALLOWED, CHECKOUT_REQUIRED, MAX_REENTRIES_EXCEEDED, VENUE_AT_CAPACITY, EXPIRED, RESTRICTED]
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Rate limit exceeded

  /workstation/scan-out:
    post:
      tags:
        - Service Point
      summary: Scan ticket for exit (check-out)
      description: |
        Scan a QR code or backup code to check out an attendee.
        Validates that attendee is currently inside the venue.
        Rate limited to 100 scans per minute per user, 200 per minute per IP.
      operationId: scanOut
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - eventId
              properties:
                code:
                  type: string
                  description: QR code content or backup code
                eventId:
                  type: string
                  description: Event ID
                checkpointId:
                  type: string
                  description: Optional checkpoint/facility ID
                location:
                  type: object
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
      responses:
        '200':
          description: Check-out successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      registrationId:
                        type: string
                      checkedOutAt:
                        type: string
                        format: date-time
                      attendeeName:
                        type: string
                      ticketType:
                        type: string
        '400':
          description: Check-out error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    enum: [NOT_CHECKED_IN, INVALID_TICKET, WRONG_EVENT]
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Rate limit exceeded

  /workstation/manual-check-in:
    post:
      tags:
        - Service Point
      summary: Manual check-in by search term
      description: |
        Check in an attendee by email or name search.
        Requires ADMIN_STAFF role or higher.
        Rate limited to 100 requests per minute.
      operationId: manualCheckIn
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventId
                - searchTerm
              properties:
                eventId:
                  type: string
                searchTerm:
                  type: string
                  description: Email or name to search
                facility:
                  type: string
                  description: Optional facility/checkpoint name
      responses:
        '200':
          description: Manual check-in successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      registrationId:
                        type: string
                      attendeeName:
                        type: string
                      ticketType:
                        type: string
                      scanType:
                        type: string
                        example: MANUAL_CHECK_IN
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /workstation/manual-check-out:
    post:
      tags:
        - Service Point
      summary: Manual check-out by search term
      description: |
        Check out an attendee by email or name search.
        Requires ADMIN_STAFF role or higher.
        Validates that attendee is currently inside the venue.
      operationId: manualCheckOut
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventId
                - searchTerm
              properties:
                eventId:
                  type: string
                searchTerm:
                  type: string
                  description: Email or name to search
                facility:
                  type: string
                  description: Optional facility/checkpoint name
      responses:
        '200':
          description: Manual check-out successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      registrationId:
                        type: string
                      checkedOutAt:
                        type: string
                        format: date-time
                      attendeeName:
                        type: string
                      ticketType:
                        type: string
        '400':
          description: Check-out error (e.g., attendee not checked in)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==================== OFFLINE SYNC ====================
  /offline/scans/batch:
    post:
      tags:
        - Offline Sync
      summary: Upload batch of scans from mobile device
      description: Process multiple scans queued offline and detect conflicts. Supports both check-in and check-out scan types.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scans
              properties:
                scans:
                  type: array
                  items:
                    $ref: '#/components/schemas/OfflineScanInput'
      responses:
        '200':
          description: Batch scan processing completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BatchScanResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /offline/scans/status/{eventId}:
    get:
      tags:
        - Offline Sync
      summary: Get sync status for mobile device
      description: Retrieve pending scan counts and last sync time
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Sync status retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SyncStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /offline/scans/conflicts/{eventId}:
    get:
      tags:
        - Offline Sync
      summary: Get scan conflicts for event
      description: Detect duplicate scans within a time window
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
        - name: timeWindow
          in: query
          schema:
            type: integer
            default: 5
          description: Time window in minutes for conflict detection
      responses:
        '200':
          description: Conflicts detected successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          conflicts:
                            type: array
                            items:
                              $ref: '#/components/schemas/ScanConflict'
                          count:
                            type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /offline/scans/conflicts/{conflictId}/resolve:
    post:
      tags:
        - Offline Sync
      summary: Resolve scan conflict
      description: Apply resolution strategy to duplicate scans
      parameters:
        - name: conflictId
          in: path
          required: true
          schema:
            type: string
          description: ID of the conflict (format conflict-scanId1-scanId2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resolution
              properties:
                resolution:
                  type: string
                  enum: [keep_first, keep_latest, keep_both]
                  description: Strategy for resolving the conflict
      responses:
        '200':
          description: Conflict resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==================== VENUE CAPACITY ====================
  /capacity/events/{eventId}:
    get:
      tags:
        - Venue Capacity
      summary: Get venue capacity status
      description: Returns current occupancy, max capacity, and percentage filled
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Capacity status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      eventId:
                        type: string
                      maxCapacity:
                        type: integer
                        nullable: true
                      currentOccupancy:
                        type: integer
                      availableCapacity:
                        type: integer
                        nullable: true
                      percentageFilled:
                        type: number
                      isAtCapacity:
                        type: boolean
                      thresholdBreached:
                        type: integer
                        nullable: true
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    put:
      tags:
        - Venue Capacity
      summary: Set venue maximum capacity
      description: Configure the maximum capacity for a venue (admin only)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxCapacity:
                  type: integer
                  nullable: true
                  description: Maximum capacity (null for unlimited)
      responses:
        '200':
          description: Capacity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /capacity/events/{eventId}/overview:
    get:
      tags:
        - Venue Capacity
      summary: Get comprehensive capacity overview
      description: Returns venue capacity and all zone capacities with summary stats
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Capacity overview retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      venue:
                        type: object
                        description: Venue capacity status
                      zones:
                        type: array
                        items:
                          type: object
                          properties:
                            zoneId:
                              type: string
                            zoneName:
                              type: string
                            maxCapacity:
                              type: integer
                              nullable: true
                            currentOccupancy:
                              type: integer
                            percentageFilled:
                              type: number
                            isAtCapacity:
                              type: boolean
                      summary:
                        type: object
                        properties:
                          totalZones:
                            type: integer
                          zonesAtCapacity:
                            type: integer
                          totalZoneCapacity:
                            type: integer
                            nullable: true
                          totalZoneOccupancy:
                            type: integer
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /capacity/events/{eventId}/zones:
    get:
      tags:
        - Venue Capacity
      summary: Get zone capacity statuses
      description: Returns capacity status for all active zones
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Zone capacities retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        zoneId:
                          type: string
                        zoneName:
                          type: string
                        zoneCode:
                          type: string
                        maxCapacity:
                          type: integer
                          nullable: true
                        currentOccupancy:
                          type: integer
                        availableCapacity:
                          type: integer
                          nullable: true
                        percentageFilled:
                          type: number
                        isAtCapacity:
                          type: boolean
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /capacity/events/{eventId}/can-check-in:
    get:
      tags:
        - Venue Capacity
      summary: Check if venue can accept check-ins
      description: Quick check to see if venue has capacity for more attendees
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
        - name: count
          in: query
          required: false
          schema:
            type: integer
