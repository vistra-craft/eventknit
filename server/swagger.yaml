      operationId: googleAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Google OAuth token (ID token or access token)
                tokenType:
                  type: string
                  enum: [id_token, access_token]
