  # ==================== ORGANIZER PAYOUTS ====================

  /organizer-dashboard/payouts/preferences:
    get:
      tags:
        - Organizer Payouts
      summary: Get payout preferences
      description: Get the organizer's payout preferences including bank details and auto-payout settings
      operationId: getPayoutPreferences
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Payout preferences retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          preferences:
                            $ref: '#/components/schemas/PayoutPreference'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      tags:
        - Organizer Payouts
      summary: Update payout preferences
      description: Update bank details, payout method, and auto-payout settings
      operationId: updatePayoutPreferences
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                primaryMethod:
                  type: string
                  maxLength: 50
                bankName:
                  type: string
                  maxLength: 200
                accountName:
                  type: string
                  maxLength: 200
                accountNumber:
                  type: string
                  maxLength: 50
                bankCode:
                  type: string
                  maxLength: 20
                routingNumber:
                  type: string
                  maxLength: 50
                paystackRecipientCode:
                  type: string
                  maxLength: 100
                alternativeMethods:
                  type: object
                autoPayoutEnabled:
                  type: boolean
                autoPayoutThreshold:
                  type: number
                autoPayoutSchedule:
                  type: string
                  enum: [daily, weekly, monthly]
                taxId:
                  type: string
                  maxLength: 50
                taxCountry:
                  type: string
                  maxLength: 5
      responses:
        '200':
          description: Payout preferences updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          preferences:
                            $ref: '#/components/schemas/PayoutPreference'
        '400':
          $ref: '#/components/responses/ValidationError'

  /organizer-dashboard/payouts/history:
    get:
      tags:
        - Organizer Payouts
      summary: Get payout history
      description: Get paginated list of the organizer's past disbursements
      operationId: getPayoutHistory
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed, cancelled]
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Payout history retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          disbursements:
                            type: array
                            items:
                              $ref: '#/components/schemas/Disbursement'
                          pagination:
                            allOf:
                              - $ref: '#/components/schemas/Pagination'
                              - type: object
                                properties:
                                  hasMore:
                                    type: boolean
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /organizer-dashboard/payouts/schedule:
    post:
      tags:
        - Organizer Payouts
      summary: Schedule a payout
      description: Schedule a future payout for the organizer's earnings
      operationId: schedulePayout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scheduledDate
              properties:
                eventId:
                  type: string
                  format: uuid
                amount:
                  type: number
                  minimum: 0
                scheduledDate:
                  type: string
                  format: date-time
                  description: Must be a future date
                notes:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Payout scheduled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          disbursement:
                            $ref: '#/components/schemas/Disbursement'
        '400':
          $ref: '#/components/responses/ValidationError'

  /organizer-dashboard/payouts/summary:
    get:
      tags:
        - Organizer Payouts
      summary: Get payout summary
      description: Get aggregated payout summary (pending, scheduled, total paid)
      operationId: getPayoutSummary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Payout summary retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pending:
                            type: object
                            properties:
                              amount:
                                type: number
                              count:
                                type: integer
                          scheduled:
                            type: object
                            properties:
                              amount:
                                type: number
                              count:
                                type: integer
                          totalPaid:
                            type: number
                          lastPayoutDate:
                            type: string
                            format: date-time
                            nullable: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'

