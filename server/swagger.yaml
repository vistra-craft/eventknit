openapi: 3.0.3
info:
  title: EventKnit API
  description: |
    EventKnit is a comprehensive ticketing platform API that enables event management, ticket sales, payments, and real-time communications.

    ## Authentication
    Most endpoints require JWT authentication. Include the access token in the Authorization header:
    ```
    Authorization: Bearer <your_access_token>
    ```

    ## Base URL
    All API routes are prefixed with `/api/v1`

    ## Rate Limiting
    API requests are rate-limited to prevent abuse. Rate limits vary by endpoint type.
  version: 1.0.0
  contact:
    name: EventKnit Support
    email: support@eventknit.com
  license:
    name: ISC

servers:
  - url: http://localhost:3001/api/v1
    description: Development server
  - url: https://api.eventknit.com/api/v1
    description: Production server

tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: Events
    description: Event management operations
  - name: Tickets
    description: Ticket management and operations
  - name: Payments
    description: Payment processing endpoints
  - name: Users
    description: User profile and preference management
  - name: Organizers
    description: Organizer-specific operations
  - name: Admin
    description: Administrative operations
  - name: Notifications
    description: Notification management
  - name: Analytics
    description: Analytics and reporting
  - name: Financial
    description: Financial management and reporting
  - name: Service Point
    description: Service point operations including badge templates, workstation, and facility management
  - name: Offline Sync
    description: Offline data synchronization for mobile devices

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from login/registration

  schemas:
    # Common Response Schemas
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    # User Schemas
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum: [SUPERADMIN, ADMIN, ADMIN_STAFF, MARKETER, SUPPORT, TELLER, ORGANIZER, ORGANIZER_STAFF, ORGANIZER_TELLER, ATTENDEE]
        emailVerified:
          type: boolean
        profileImage:
          type: string
          nullable: true
        isActive:
          type: boolean
        isSuspended:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (expires in 15 minutes)
        refreshToken:
          type: string
          description: JWT refresh token (expires in 7 days)
        user:
          $ref: '#/components/schemas/User'

    # Event Schemas
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        category:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: object
          properties:
            address:
              type: string
            city:
              type: string
            state:
              type: string
            country:
              type: string
            latitude:
              type: number
            longitude:
              type: number
        eventType:
          type: string
          enum: [PHYSICAL, VIRTUAL, HYBRID]
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, CANCELLED, COMPLETED]
        isPublished:
          type: boolean
        capacity:
          type: integer
        coverImage:
          type: string
        organizerId:
          type: string
          format: uuid
        organizer:
          $ref: '#/components/schemas/User'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/TicketType'
        registrationCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TicketType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        currency:
          type: string
          default: USD
        quantity:
          type: integer
        available:
          type: integer
        eventId:
          type: string
          format: uuid
        isFree:
          type: boolean
        salesStartDate:
          type: string
          format: date-time
        salesEndDate:
          type: string
          format: date-time

    Registration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        ticketTypeId:
          type: string
          format: uuid
        quantity:
          type: integer
        totalAmount:
          type: number
          format: decimal
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, CHECKED_IN]
        attendeeInfo:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
            phoneNumber:
              type: string
        paymentStatus:
          type: string
          enum: [PENDING, COMPLETED, FAILED, REFUNDED]
        qrCode:
          type: string
        createdAt:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
        currency:
          type: string
        paymentMethod:
          type: string
          enum: [PAYSTACK, STRIPE, MPESA, CASH]
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, REFUNDED]
        transactionReference:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

    TicketTransfer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        fromUserId:
          type: string
          format: uuid
        toUserId:
          type: string
          format: uuid
          nullable: true
        toEmail:
          type: string
          format: email
          nullable: true
        transferToken:
          type: string
        status:
          type: string
          enum: [PENDING, ACCEPTED, CANCELLED, EXPIRED]
        message:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    TicketResale:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        sellerUserId:
          type: string
          format: uuid
        buyerUserId:
          type: string
          format: uuid
          nullable: true
        originalPrice:
          type: number
          format: decimal
        resalePrice:
          type: number
          format: decimal
        platformFee:
          type: number
          format: decimal
          description: 10% platform fee
        sellerPayout:
          type: number
          format: decimal
        status:
          type: string
          enum: [LISTED, SOLD, CANCELLED]
        notes:
          type: string
          nullable: true
        listedAt:
          type: string
          format: date-time
        soldAt:
          type: string
          format: date-time
          nullable: true

    DigitalWallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        autoAddTickets:
          type: boolean
          description: Automatically add new tickets
        backupEnabled:
          type: boolean
          description: Enable backup codes
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        walletTickets:
          type: array
          items:
            $ref: '#/components/schemas/WalletTicket'

    WalletTicket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        backupCode:
          type: string
          description: Manual entry code (format WLT-{regId8}-{timestamp36})
        isActive:
          type: boolean
        passData:
          type: object
          nullable: true
          description: Apple/Google pass data
        lastAccessedAt:
          type: string
          format: date-time
          nullable: true
        addedAt:
          type: string
          format: date-time

    # Badge Template Schemas
    BadgeElement:
      type: object
      required:
        - id
        - type
        - content
        - x
        - y
        - width
        - height
        - zIndex
      properties:
        id:
          type: string
          description: Unique element identifier
        type:
          type: string
          enum: [text, image, qr, shape, logo, barcode, ribbon]
          description: Element type
        content:
          type: string
          description: Element content (can include template variables like {{fullName}})
        x:
          type: number
          description: X position in millimeters
        y:
          type: number
          description: Y position in millimeters
        width:
          type: number
          description: Width in millimeters
        height:
          type: number
          description: Height in millimeters
        fontSize:
          type: number
          nullable: true
          description: Font size for text elements
        fontFamily:
          type: string
          nullable: true
          description: Font family for text elements
        fontWeight:
          type: string
          enum: [normal, bold, light]
          nullable: true
        textAlign:
          type: string
          enum: [left, center, right]
          nullable: true
        color:
          type: string
          nullable: true
          description: Text or foreground color (hex format)
        backgroundColor:
          type: string
          nullable: true
          description: Background color (hex format)
        borderRadius:
          type: number
          nullable: true
          description: Border radius in pixels
        opacity:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        rotation:
          type: number
          nullable: true
          description: Rotation angle in degrees
        zIndex:
          type: integer
          description: Layer order (higher = on top)
        isVisible:
          type: boolean
          nullable: true
        isLocked:
          type: boolean
          nullable: true
        ribbonIcon:
          type: string
          enum: [crown, star, check-circle, award, badge, none]
          nullable: true
          description: Icon for ribbon elements
        ribbonGradient:
          type: string
          nullable: true
          description: CSS gradient string for ribbon background

    BadgeTemplate:
      type: object
      required:
        - id
        - name
        - width
        - height
        - sizePreset
        - orientation
        - backgroundColor
        - elements
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Template name
        description:
          type: string
          nullable: true
          description: Template description
        width:
          type: number
          description: Badge width in millimeters
          example: 101.6
        height:
          type: number
          description: Badge height in millimeters
          example: 76.2
        sizePreset:
          type: string
          enum: [4x3, 3.5x2.25, 4x6, A6, custom]
          description: Preset badge size
        orientation:
          type: string
          enum: [portrait, landscape]
        backgroundColor:
          type: string
          description: Background color (hex format)
          example: "#ffffff"
        backgroundImage:
          type: string
          nullable: true
          description: URL to background image (Cloudinary)
        elements:
          type: array
          items:
            $ref: '#/components/schemas/BadgeElement'
        isDefault:
          type: boolean
          description: Whether this is the default template
        isActive:
          type: boolean
          description: Whether the template is active
        organizerId:
          type: string
          format: uuid
          nullable: true
        eventId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FacilityZone:
      type: object
      required:
        - id
        - eventId
        - name
        - code
        - currentOccupancy
        - isActive
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        name:
          type: string
          description: Zone display name
          example: "VIP Lounge"
        code:
          type: string
          description: Unique zone code (max 10 chars)
          example: "VIP"
        description:
          type: string
          nullable: true
          description: Zone description
        maxCapacity:
          type: integer
          nullable: true
          description: Maximum simultaneous occupancy (null = unlimited)
          example: 100
        currentOccupancy:
          type: integer
          description: Current number of people in zone
          example: 25
        accessStart:
          type: string
          format: date-time
          nullable: true
          description: Zone opening time
        accessEnd:
          type: string
          format: date-time
          nullable: true
          description: Zone closing time
        isActive:
          type: boolean
          description: Whether the zone is active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FacilityZoneMapping:
      type: object
      properties:
        id:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        facility:
          type: object
          properties:
            id:
              type: string
            name:
              type: string

    AttendeeZoneAccess:
      type: object
      required:
        - id
        - registrationId
        - zoneId
        - grantedBy
        - isActive
      properties:
        id:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        accessCount:
          type: integer
          description: Number of times accessed
        lastAccessAt:
          type: string
          format: date-time
          nullable: true

    ZoneCapacityInfo:
      type: object
      properties:
        currentOccupancy:
          type: integer
          example: 75
        maxCapacity:
          type: integer
          nullable: true
          example: 100
        availableCapacity:
          type: integer
          nullable: true
          example: 25
        isFull:
          type: boolean
          example: false
        percentFull:
          type: integer
          description: Percentage of capacity used (0-100)
          example: 75

    FacilityMovement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        fromZoneId:
          type: string
          format: uuid
          nullable: true
        toZoneId:
          type: string
          format: uuid
        movementType:
          type: string
          enum: [entry, zone_change, exit]
        sequenceNumber:
          type: integer
          description: Movement sequence (1, 2, 3...)
        scannedAt:
          type: string
          format: date-time
        scannedBy:
          type: string
          format: uuid

    Printer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          description: User-friendly printer name
        driver:
          type: string
          enum: [cups, windows, printnode]
          description: Printer driver type
        deviceId:
          type: string
          description: System printer name or cloud ID
        host:
          type: string
          nullable: true
          description: Network printer host
        port:
          type: integer
          nullable: true
          description: Network printer port
        apiKey:
          type: string
          nullable: true
          description: PrintNode API key for cloud printing
        supportedSizes:
          type: array
          items:
            type: string
          description: Supported paper sizes
        paperSize:
          type: string
          description: Default paper size
        orientation:
          type: string
          enum: [portrait, landscape]
          description: Default orientation
        isOnline:
          type: boolean
          description: Current online status
        isActive:
          type: boolean
          description: Whether printer is active (not soft-deleted)
        lastChecked:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    PrinterConfig:
      type: object
      required:
        - name
        - driver
        - deviceId
      properties:
        name:
          type: string
          description: User-friendly printer name
          minLength: 1
          maxLength: 100
        driver:
          type: string
          enum: [cups, windows, printnode]
          description: Printer driver type
        deviceId:
          type: string
          description: System printer name or cloud ID
        host:
          type: string
          description: Network printer host
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Network printer port
        apiKey:
          type: string
          description: PrintNode API key (required for PrintNode driver)
        supportedSizes:
          type: array
          items:
            type: string
          default: ['4x3', 'A6']
          description: Supported paper sizes
        paperSize:
          type: string
          default: '4x3'
          description: Default paper size
        orientation:
          type: string
          enum: [portrait, landscape]
          default: landscape
          description: Default orientation
        eventId:
          type: string
          format: uuid
          description: Link printer to specific event (optional)

    PrinterStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isOnline:
          type: boolean
          description: Whether printer is currently online
        driver:
          type: string
          enum: [cups, windows, printnode]
        lastChecked:
          type: string
          format: date-time
          nullable: true

    PrintJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        printerId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, printing, completed, failed, cancelled]
          description: Current job status
        priority:
          type: integer
          description: Higher priority jobs print first
        copies:
          type: integer
          minimum: 1
          maximum: 10
          description: Number of copies to print
        pdfUrl:
          type: string
          format: uri
          nullable: true
          description: Generated PDF URL (Cloudinary)
        sentToPrinter:
          type: string
          format: date-time
          nullable: true
          description: When job was sent to printer
        printedAt:
          type: string
          format: date-time
          nullable: true
          description: When job completed printing
        retryCount:
          type: integer
          description: Number of retry attempts
        maxRetries:
          type: integer
          default: 3
          description: Maximum retry attempts
        errorMessage:
          type: string
          nullable: true
          description: Error message if job failed
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    # Offline Sync Schemas
    OfflineEventData:
      type: object
      properties:
        event:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
        attendees:
          type: array
          items:
            type: object
            properties:
              registrationId:
                type: string
              fullName:
                type: string
              email:
                type: string
                format: email
              ticketType:
                type: string
                nullable: true
              photo:
                type: string
                nullable: true
              qrCode:
                type: string
                nullable: true
              backupCode:
                type: string
                nullable: true
              isCurrentlyInside:
                type: boolean
              lastCheckInAt:
                type: string
                format: date-time
                nullable: true
              authorizedZones:
                type: array
                items:
                  type: string
                description: Array of zone IDs the attendee can access
        zones:
          type: array
          items:
            type: object
            properties:
              zoneId:
                type: string
              name:
                type: string
              code:
                type: string
              maxCapacity:
                type: integer
                nullable: true
              currentOccupancy:
                type: integer
              accessStart:
                type: string
                format: date-time
                nullable: true
              accessEnd:
                type: string
                format: date-time
                nullable: true
              isActive:
                type: boolean

    OfflineScanInput:
      type: object
      required:
        - id
        - registrationId
        - checkpointId
        - qrCode
        - scannedAt
        - scannedBy
      properties:
        id:
          type: string
          description: Mobile-generated scan ID
        registrationId:
          type: string
        checkpointId:
          type: string
        qrCode:
          type: string
        codeType:
          type: string
          enum: [ticket, backup]
          default: ticket
        signatureValid:
          type: boolean
          default: true
        scannedAt:
          type: string
          format: date-time
        scannedBy:
          type: string
          description: User ID of staff member
        deviceInfo:
          type: object
          nullable: true
          description: JSON object with device metadata

    BatchScanResult:
      type: object
      properties:
        successCount:
          type: integer
          description: Number of scans successfully processed
        failureCount:
          type: integer
          description: Number of scans that failed
        conflicts:
          type: array
          items:
            type: object
            properties:
              mobileId:
                type: string
                description: ID from mobile device
              serverId:
                type: string
                nullable: true
                description: ID of existing scan on server
              reason:
                type: string
                enum: [duplicate_scan, processing_error]
              details:
                type: object
                description: Additional conflict information

    SyncStatus:
      type: object
      properties:
        totalAttendees:
          type: integer
          description: Total confirmed registrations for event
        totalScans:
          type: integer
          description: Total scans recorded
        userScansToday:
          type: integer
          description: Scans by this user today
        lastUpdated:
          type: string
          format: date-time

    ScanConflict:
      type: object
      properties:
        id:
          type: string
          description: Conflict ID (format conflict-scanId1-scanId2)
        mobileId:
          type: string
          description: Later scan ID (assumed from mobile)
        serverId:
          type: string
          description: Earlier scan ID (assumed from server)
        registrationId:
          type: string
        checkpointId:
          type: string
        mobileScanTime:
          type: string
          format: date-time
        serverScanTime:
          type: string
          format: date-time
        timeDifferenceMs:
          type: integer
          description: Time difference in milliseconds
        status:
          type: string
          enum: [pending, resolved]
        resolution:
          type: string
          enum: [keep_first, keep_latest, keep_both]
          nullable: true

  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Unauthorized access

    ForbiddenError:
      description: User does not have permission to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: You do not have permission to perform this action

    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Resource not found

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Validation failed
            errors:
              - field: email
                message: Valid email is required

paths:
  # ==================== AUTHENTICATION ====================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account with email and password
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
                phoneNumber:
                  type: string
                role:
                  type: string
                  enum: [ATTENDEE, ORGANIZER]
                  default: ATTENDEE
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/register-code/request:
    post:
      tags:
        - Authentication
      summary: Request registration verification code
      description: Request a verification code for email-only registration (passwordless)
      operationId: requestRegistrationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification code sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/register-code/verify:
    post:
      tags:
        - Authentication
      summary: Verify registration code and create account
      description: Verify the registration code and complete account creation
      operationId: verifyRegistrationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - firstName
                - lastName
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                phoneNumber:
                  type: string
                role:
                  type: string
                  enum: [ATTENDEE, ORGANIZER]
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/email-oauth/request:
    post:
      tags:
        - Authentication
      summary: Request Email OAuth code
      description: Request a code-based passwordless login/registration
      operationId: requestEmailOAuthCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OAuth code sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/email-oauth/verify:
    post:
      tags:
        - Authentication
      summary: Verify Email OAuth code
      description: Verify OAuth code and authenticate user (creates account if new, logs in if existing)
      operationId: verifyEmailOAuthCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                phoneNumber:
                  type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'

  /auth/google:
    post:
      tags:
        - Authentication
      summary: Google OAuth login/registration
      description: Authenticate user with Google OAuth token
      operationId: googleAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
                  description: Google ID token
      responses:
        '200':
          description: Google authentication successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'

  /auth/apple:
    post:
      tags:
        - Authentication
      summary: Apple Sign In OAuth login/registration
      description: Authenticate user with Apple Sign In
      operationId: appleAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identityToken
              properties:
                identityToken:
                  type: string
                  description: Apple identity token
                authorizationCode:
                  type: string
                user:
                  type: object
                  properties:
                    firstName:
                      type: string
                    lastName:
                      type: string
                    email:
                      type: string
      responses:
        '200':
          description: Apple authentication successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get a new access token using refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidate current session
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user profile
      description: Retrieve the authenticated user's profile information
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/profile:
    put:
      tags:
        - Authentication
      summary: Update user profile
      description: Update the authenticated user's profile information
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phoneNumber:
                  type: string
                profileImage:
                  type: string
                  format: binary
                bio:
                  type: string
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/password/reset-request:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send password reset email to user
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/password/reset-confirm:
    post:
      tags:
        - Authentication
      summary: Confirm password reset
      description: Reset password using reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/password/change:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change password for authenticated user
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==================== EVENTS ====================
  /events:
    get:
      tags:
        - Events
      summary: Get all events
      description: Retrieve a list of all public events with optional filters
      operationId: getEvents
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, CANCELLED, COMPLETED]
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: eventType
          in: query
          schema:
            type: string
            enum: [PHYSICAL, VIRTUAL, HYBRID]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          events:
                            type: array
                            items:
                              $ref: '#/components/schemas/Event'
                          pagination:
                            $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Events
      summary: Create a new event
      description: Create a new event (requires ORGANIZER role or higher)
      operationId: createEvent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - startDate
                - endDate
                - category
                - eventType
              properties:
                title:
                  type: string
                description:
                  type: string
                shortDescription:
                  type: string
                category:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                location:
                  type: object
                  properties:
                    address:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    country:
                      type: string
                eventType:
                  type: string
                  enum: [PHYSICAL, VIRTUAL, HYBRID]
                capacity:
                  type: integer
                coverImage:
                  type: string
                tickets:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      price:
                        type: number
                      quantity:
                        type: integer
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /events/{id}:
    get:
      tags:
        - Events
      summary: Get event by ID
      description: Retrieve detailed information about a specific event
      operationId: getEventById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Events
      summary: Update event
      description: Update an existing event (requires ORGANIZER role or higher)
      operationId: updateEvent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                capacity:
                  type: integer
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Events
      summary: Delete event
      description: Delete an event (requires ORGANIZER role or higher)
      operationId: deleteEvent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /events/{id}/register:
    post:
      tags:
        - Events
      summary: Register for an event
      description: Register for an event as an authenticated user
      operationId: registerForEvent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ticketTypeId
                - quantity
              properties:
                ticketTypeId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
                attendeeInfo:
                  type: object
                  properties:
                    firstName:
                      type: string
                    lastName:
                      type: string
                    email:
                      type: string
                    phoneNumber:
                      type: string
      responses:
        '201':
          description: Registration created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Registration'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /events/{id}/register-guest:
    post:
      tags:
        - Events
      summary: Register for an event as guest
      description: Register for an event without authentication (public endpoint)
      operationId: registerAsGuest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ticketTypeId
                - quantity
                - attendeeInfo
              properties:
                ticketTypeId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
                attendeeInfo:
                  type: object
                  required:
                    - firstName
                    - lastName
                    - email
                  properties:
                    firstName:
                      type: string
                    lastName:
                      type: string
                    email:
                      type: string
                      format: email
                    phoneNumber:
                      type: string
      responses:
        '201':
          description: Guest registration created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Registration'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /events/{id}/registrations:
    get:
      tags:
        - Events
      summary: Get event registrations
      description: Get all registrations for an event (requires ORGANIZER role or higher)
      operationId: getEventRegistrations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, CANCELLED, CHECKED_IN]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Registrations retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          registrations:
                            type: array
                            items:
                              $ref: '#/components/schemas/Registration'
                          pagination:
                            $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /events/{id}/approve:
    post:
      tags:
        - Events
      summary: Approve event
      description: Approve a pending event (requires ADMIN_STAFF role or higher)
      operationId: approveEvent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /events/{id}/reject:
    post:
      tags:
        - Events
      summary: Reject event
      description: Reject a pending event (requires ADMIN_STAFF role or higher)
      operationId: rejectEvent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Event rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # ==================== TICKETS ====================
  /tickets/{registrationId}:
    get:
      tags:
        - Tickets
      summary: Get ticket by registration ID
      description: Retrieve ticket information for a specific registration
      operationId: getTicket
      security:
        - BearerAuth: []
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Registration'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /tickets/{registrationId}/view:
    get:
      tags:
        - Tickets
      summary: Get ticket publicly
      description: View ticket information with email verification (public endpoint)
      operationId: getTicketPublic
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Ticket retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Registration'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /tickets/{registrationId}/download:
    get:
      tags:
        - Tickets
      summary: Download ticket as PDF
      description: Download ticket in PDF format
      operationId: downloadTicketPDF
      security:
        - BearerAuth: []
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PDF generated successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /tickets/{registrationId}/resend:
    post:
      tags:
        - Tickets
      summary: Resend ticket email
      description: Resend ticket confirmation email (rate limited to 3 per hour)
      operationId: resendTicketEmail
      security:
        - BearerAuth: []
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
