  # ==================== TICKET TRANSFERS ====================
  /user/dashboard/transfers/{registrationId}:
    post:
      tags:
        - Tickets
      summary: Initiate ticket transfer
      description: Transfer ticket to another user by userId or email
      operationId: initiateTransfer
      security:
        - BearerAuth: []
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toUserId:
                  type: string
                  format: uuid
                  description: Transfer to existing user by ID
                toEmail:
                  type: string
                  format: email
                  description: Transfer to user by email (creates account if needed)
                message:
                  type: string
                  description: Optional message to recipient
              oneOf:
                - required: [toUserId]
                - required: [toEmail]
      responses:
        '201':
          description: Transfer initiated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          transferToken:
                            type: string
                          status:
                            type: string
                            enum: [PENDING, ACCEPTED, CANCELLED, EXPIRED]
                          expiresAt:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/ValidationError'

  /user/dashboard/transfers/accept/{transferToken}:
    post:
      tags:
        - Tickets
      summary: Accept ticket transfer
      description: Accept a pending ticket transfer offer
      operationId: acceptTransfer
      security:
        - BearerAuth: []
      parameters:
        - name: transferToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transfer accepted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          newRegistrationId:
                            type: string
                            format: uuid
                          status:
                            type: string
                            example: ACCEPTED
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /user/dashboard/transfers/{transferId}/cancel:
    post:
      tags:
        - Tickets
      summary: Cancel ticket transfer
      description: Cancel a pending ticket transfer
      operationId: cancelTransfer
      security:
        - BearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transfer cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /user/dashboard/transfers:
