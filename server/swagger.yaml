  # ==================== Print Job Management ====================

  /print-jobs:
    post:
      tags:
        - Service Point
      summary: Create print job
      description: Create a new badge print job for an attendee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - printerId
                - templateId
                - registrationId
              properties:
                printerId:
                  type: string
                  description: ID of the printer to use
                templateId:
                  type: string
                  description: ID of the badge template
                registrationId:
                  type: string
                  description: ID of the event registration
                copies:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 10
                priority:
                  type: integer
                  default: 0
                  description: Higher priority jobs print first
      responses:
        '201':
          description: Print job created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          printJob:
                            $ref: '#/components/schemas/PrintJob'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    get:
      tags:
        - Service Point
      summary: Get print jobs
      description: Retrieve print jobs with optional filtering
      parameters:
        - name: printerId
          in: query
          schema:
            type: string
          description: Filter by printer ID
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, printing, completed, failed, cancelled]
          description: Filter by job status
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Print jobs retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
