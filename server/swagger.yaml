          type: string
          format: uri
          nullable: true
          description: Generated PDF URL (Cloudinary)
        sentToPrinter:
          type: string
          format: date-time
          nullable: true
          description: When job was sent to printer
        printedAt:
          type: string
          format: date-time
          nullable: true
          description: When job completed printing
        retryCount:
          type: integer
          description: Number of retry attempts
        maxRetries:
          type: integer
          default: 3
          description: Maximum retry attempts
        errorMessage:
          type: string
          nullable: true
          description: Error message if job failed
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

