          description: Number of people to check in
      responses:
        '200':
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      canCheckIn:
                        type: boolean
                      requestedCount:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /capacity/events/{eventId}/reset:
    post:
      tags:
        - Venue Capacity
      summary: Reset occupancy counters
      description: Reset all venue and zone occupancy counters to zero (admin only)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Occupancy reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
