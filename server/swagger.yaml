  /registrations/{registrationId}/movements:
    get:
      tags:
        - Service Point
      summary: Get attendee movements
      description: Get movement history for a specific attendee
      operationId: getAttendeeMovements
      security:
        - BearerAuth: []
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Movements retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          movements:
                            type: array
                            items:
                              $ref: '#/components/schemas/FacilityMovement'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==================== Printer Management ====================

  /printers/discover:
    get:
      tags:
        - Service Point
      summary: Discover available printers
      description: Auto-detect printers on the system using CUPS (Mac/Linux) or Windows print server
      parameters:
        - name: driver
          in: query
          required: true
          schema:
            type: string
            enum: [cups, windows]
          description: Printer driver to use for discovery
      responses:
        '200':
          description: Printers discovered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          printers:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                deviceId:
                                  type: string
                                driver:
                                  type: string
                                isAvailable:
                                  type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /printers:
    post:
      tags:
        - Service Point
      summary: Register a printer
      description: Register a new printer for badge printing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterConfig'
      responses:
        '201':
          description: Printer registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          printer:
                            $ref: '#/components/schemas/Printer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    get:
      tags:
        - Service Point
      summary: Get all printers
      description: Retrieve all registered printers with optional filtering
      parameters:
        - name: eventId
          in: query
          schema:
            type: string
          description: Filter printers by event ID
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
          description: Include soft-deleted printers
      responses:
        '200':
          description: Printers retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          printers:
                            type: array
                            items:
                              $ref: '#/components/schemas/Printer'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /printers/{printerId}:
    get:
      tags:
        - Service Point
      summary: Get printer by ID
      description: Retrieve a specific printer's details
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Printer retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          printer:
                            $ref: '#/components/schemas/Printer'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    put:
      tags:
        - Service Point
      summary: Update printer configuration
      description: Update an existing printer's settings
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterConfig'
      responses:
        '200':
          description: Printer updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          printer:
                            $ref: '#/components/schemas/Printer'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    delete:
      tags:
        - Service Point
      summary: Delete printer
      description: Soft delete a printer (sets isActive to false, preserves print job history)
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Printer deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /printers/{printerId}/status:
    get:
      tags:
        - Service Point
      summary: Check printer status
      description: Check if printer is online and update status in database
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Printer status retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            $ref: '#/components/schemas/PrinterStatus'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /printers/{printerId}/test:
    post:
      tags:
        - Service Point
      summary: Test printer
      description: Send a test page to verify printer connectivity
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Test page sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==================== Print Job Management ====================

  /print-jobs:
    post:
      tags:
        - Service Point
      summary: Create print job
      description: Create a new badge print job for an attendee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - printerId
                - templateId
                - registrationId
              properties:
                printerId:
                  type: string
                  description: ID of the printer to use
                templateId:
                  type: string
                  description: ID of the badge template
                registrationId:
                  type: string
                  description: ID of the event registration
                copies:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 10
                priority:
                  type: integer
                  default: 0
                  description: Higher priority jobs print first
      responses:
        '201':
          description: Print job created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          printJob:
                            $ref: '#/components/schemas/PrintJob'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    get:
      tags:
        - Service Point
      summary: Get print jobs
      description: Retrieve print jobs with optional filtering
      parameters:
        - name: printerId
          in: query
          schema:
            type: string
          description: Filter by printer ID
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, printing, completed, failed, cancelled]
          description: Filter by job status
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Print jobs retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          jobs:
                            type: array
                            items:
                              $ref: '#/components/schemas/PrintJob'
                          total:
                            type: integer
                          page:
                            type: integer
                          limit:
                            type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /print-jobs/bulk:
    post:
      tags:
        - Service Point
      summary: Bulk create print jobs
      description: Create multiple print jobs for multiple attendees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - printerId
                - templateId
                - registrationIds
              properties:
                printerId:
                  type: string
                  description: ID of the printer to use
                templateId:
                  type: string
                  description: ID of the badge template
                registrationIds:
                  type: array
                  items:
                    type: string
                  description: Array of registration IDs
                copies:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 10
                priority:
                  type: integer
                  default: 0
      responses:
        '200':
          description: Bulk print jobs created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          successCount:
                            type: integer
                          failureCount:
                            type: integer
                          total:
                            type: integer
                          jobs:
                            type: array
                            items:
                              $ref: '#/components/schemas/PrintJob'
                          errors:
                            type: array
                            items:
                              type: object
                              properties:
                                registrationId:
                                  type: string
                                error:
                                  type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /print-jobs/{jobId}/cancel:
    post:
      tags:
        - Service Point
      summary: Cancel print job
      description: Cancel a queued or printing job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Print job cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==================== OFFLINE SYNC ====================
  /offline/events/{eventId}/data:
    get:
      tags:
        - Offline Sync
      summary: Download event data for offline use
      description: Bulk download attendees, zones, and facilities for offline caching on mobile devices
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Event data retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OfflineEventData'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /offline/scans/batch:
    post:
      tags:
        - Offline Sync
      summary: Upload batch of scans from mobile device
      description: Process multiple scans queued offline and detect conflicts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scans
              properties:
                scans:
                  type: array
                  items:
                    $ref: '#/components/schemas/OfflineScanInput'
      responses:
        '200':
          description: Batch scan processing completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BatchScanResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /offline/scans/status/{eventId}:
    get:
      tags:
        - Offline Sync
      summary: Get sync status for mobile device
      description: Retrieve pending scan counts and last sync time
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Sync status retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SyncStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /offline/scans/conflicts/{eventId}:
    get:
      tags:
        - Offline Sync
      summary: Get scan conflicts for event
      description: Detect duplicate scans within a time window
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
        - name: timeWindow
          in: query
          schema:
            type: integer
            default: 5
          description: Time window in minutes for conflict detection
      responses:
        '200':
          description: Conflicts detected successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          conflicts:
                            type: array
                            items:
                              $ref: '#/components/schemas/ScanConflict'
                          count:
                            type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /offline/scans/conflicts/{conflictId}/resolve:
    post:
      tags:
        - Offline Sync
      summary: Resolve scan conflict
      description: Apply resolution strategy to duplicate scans
      parameters:
        - name: conflictId
          in: path
          required: true
          schema:
            type: string
          description: ID of the conflict (format conflict-scanId1-scanId2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resolution
              properties:
                resolution:
                  type: string
                  enum: [keep_first, keep_latest, keep_both]
                  description: Strategy for resolving the conflict
      responses:
        '200':
          description: Conflict resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==================== VENUE CAPACITY ====================
  /capacity/events/{eventId}:
    get:
      tags:
        - Venue Capacity
      summary: Get venue capacity status
      description: Returns current occupancy, max capacity, and percentage filled
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Capacity status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      eventId:
                        type: string
                      maxCapacity:
                        type: integer
                        nullable: true
                      currentOccupancy:
                        type: integer
                      availableCapacity:
                        type: integer
                        nullable: true
                      percentageFilled:
                        type: number
                      isAtCapacity:
                        type: boolean
                      thresholdBreached:
                        type: integer
                        nullable: true
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    put:
      tags:
        - Venue Capacity
      summary: Set venue maximum capacity
      description: Configure the maximum capacity for a venue (admin only)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxCapacity:
                  type: integer
                  nullable: true
                  description: Maximum capacity (null for unlimited)
      responses:
        '200':
          description: Capacity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /capacity/events/{eventId}/overview:
    get:
      tags:
        - Venue Capacity
      summary: Get comprehensive capacity overview
      description: Returns venue capacity and all zone capacities with summary stats
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Capacity overview retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      venue:
                        type: object
                        description: Venue capacity status
                      zones:
                        type: array
                        items:
                          type: object
                          properties:
                            zoneId:
                              type: string
                            zoneName:
                              type: string
                            maxCapacity:
                              type: integer
                              nullable: true
                            currentOccupancy:
                              type: integer
                            percentageFilled:
                              type: number
                            isAtCapacity:
                              type: boolean
                      summary:
                        type: object
                        properties:
                          totalZones:
                            type: integer
                          zonesAtCapacity:
                            type: integer
                          totalZoneCapacity:
                            type: integer
                            nullable: true
                          totalZoneOccupancy:
                            type: integer
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /capacity/events/{eventId}/zones:
    get:
      tags:
        - Venue Capacity
      summary: Get zone capacity statuses
      description: Returns capacity status for all active zones
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Zone capacities retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        zoneId:
                          type: string
                        zoneName:
                          type: string
                        zoneCode:
                          type: string
                        maxCapacity:
                          type: integer
                          nullable: true
                        currentOccupancy:
                          type: integer
                        availableCapacity:
                          type: integer
                          nullable: true
                        percentageFilled:
                          type: number
                        isAtCapacity:
                          type: boolean
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /capacity/events/{eventId}/can-check-in:
    get:
      tags:
        - Venue Capacity
      summary: Check if venue can accept check-ins
      description: Quick check to see if venue has capacity for more attendees
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
        - name: count
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Number of people to check in
      responses:
        '200':
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      canCheckIn:
                        type: boolean
                      requestedCount:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /capacity/events/{eventId}/reset:
    post:
      tags:
        - Venue Capacity
      summary: Reset occupancy counters
      description: Reset all venue and zone occupancy counters to zero (admin only)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Occupancy reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /capacity/events/{eventId}/recalculate:
    post:
      tags:
        - Venue Capacity
      summary: Recalculate occupancy from records
      description: Recalculate occupancy counters from check-in data (admin only)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event
      responses:
        '200':
          description: Occupancy recalculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      venueOccupancy:
                        type: integer
                      zoneOccupancies:
                        type: object
                        additionalProperties:
                          type: integer
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

security:
  - BearerAuth: []
