                    properties:
                      data:
                        type: object
                        properties:
                          newRegistrationId:
                            type: string
                            format: uuid
                          status:
                            type: string
                            example: ACCEPTED
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /user/dashboard/transfers/{transferId}/cancel:
    post:
      tags:
        - Tickets
