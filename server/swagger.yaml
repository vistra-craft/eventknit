openapi: 3.0.3
info:
  title: EventKnit API
  description: |
    EventKnit is a comprehensive ticketing platform API that enables event management, ticket sales, payments, and real-time communications.

    ## Authentication
    Most endpoints require JWT authentication. Include the access token in the Authorization header:
    ```
    Authorization: Bearer <your_access_token>
    ```

    ## Base URL
    All API routes are prefixed with `/api/v1`

    ## Rate Limiting
    API requests are rate-limited to prevent abuse. Rate limits vary by endpoint type.
  version: 1.0.0
  contact:
    name: EventKnit Support
    email: support@eventknit.com
  license:
    name: ISC

servers:
  - url: http://localhost:3001/api/v1
    description: Development server
  - url: https://api.eventknit.com/api/v1
    description: Production server

tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: Events
    description: Event management operations
  - name: Tickets
    description: Ticket management and operations
  - name: Payments
    description: Payment processing endpoints
  - name: Users
    description: User profile and preference management
  - name: Organizers
    description: Organizer-specific operations
  - name: Admin
    description: Administrative operations
  - name: Notifications
    description: Notification management
  - name: Analytics
    description: Analytics and reporting
  - name: Financial
    description: Financial management and reporting
  - name: Service Point
    description: Service point operations including badge templates, workstation, and facility management
  - name: Offline Sync
    description: Offline data synchronization for mobile devices
  - name: Careers
    description: Career inquiry management for job applicants
  - name: Cart
    description: Shopping cart and ticket reservation system
  - name: Admin Finance
    description: Admin financial operations — payment transactions, platform fees, disbursements, refunds, reconciliation
  - name: Platform Finance
    description: Platform-level accounting — expenses, income, wages
  - name: Organizer Payouts
    description: Organizer payout preferences, history, and scheduling
  - name: White Label
    description: White-label branding and custom domain management for organizers

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from login/registration

  schemas:
    # Common Response Schemas
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    # Career Inquiry Schemas
    CareerInquiry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        email:
          type: string
          format: email
          description: Candidate's email address
        firstName:
          type: string
          nullable: true
          description: Candidate's first name (if provided)
        status:
          type: string
          enum: [PENDING, CONTACTED, RESPONDED, REVIEWING, REJECTED, HIRED]
          description: Current status of the inquiry
        emailSentAt:
          type: string
          format: date-time
          description: When the auto-reply email was sent
        respondedAt:
          type: string
          format: date-time
          nullable: true
          description: When the candidate responded
        notes:
          type: string
          nullable: true
          description: Internal notes from recruitment team
        reviewedBy:
          type: string
          format: uuid
          nullable: true
          description: User ID of the reviewer
        reviewedAt:
          type: string
          format: date-time
          nullable: true
          description: When the inquiry was reviewed
        source:
          type: string
          nullable: true
          description: Where the candidate found us
        createdAt:
          type: string
          format: date-time
          description: When the inquiry was submitted
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    # User Schemas
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum: [SUPERADMIN, ADMIN, ADMIN_STAFF, MARKETER, SUPPORT, TELLER, ORGANIZER, ORGANIZER_STAFF, ORGANIZER_TELLER, ATTENDEE]
        emailVerified:
          type: boolean
        profileImage:
          type: string
          nullable: true
        isActive:
          type: boolean
        isSuspended:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (expires in 15 minutes)
        refreshToken:
          type: string
          description: JWT refresh token (expires in 7 days)
        user:
          $ref: '#/components/schemas/User'

    # Event Schemas
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        category:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: object
          properties:
            address:
              type: string
            city:
              type: string
            state:
              type: string
            country:
              type: string
            latitude:
              type: number
            longitude:
              type: number
        eventType:
          type: string
          enum: [PHYSICAL, VIRTUAL, HYBRID]
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, CANCELLED, COMPLETED]
        isPublished:
          type: boolean
        capacity:
          type: integer
        coverImage:
          type: string
        organizerId:
          type: string
          format: uuid
        organizer:
          $ref: '#/components/schemas/User'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/TicketType'
        registrationCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TicketType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        currency:
          type: string
          default: USD
        quantity:
          type: integer
        available:
          type: integer
        eventId:
          type: string
          format: uuid
        isFree:
          type: boolean
        salesStartDate:
          type: string
          format: date-time
        salesEndDate:
          type: string
          format: date-time

    Registration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        ticketTypeId:
          type: string
          format: uuid
        quantity:
          type: integer
        totalAmount:
          type: number
          format: decimal
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, CHECKED_IN]
        attendeeInfo:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
            phoneNumber:
              type: string
        paymentStatus:
          type: string
          enum: [PENDING, COMPLETED, FAILED, REFUNDED]
        qrCode:
          type: string
        createdAt:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
        currency:
          type: string
        paymentMethod:
          type: string
          enum: [PAYSTACK, STRIPE, MPESA, CASH]
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, REFUNDED]
        transactionReference:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

    TicketTransfer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        fromUserId:
          type: string
          format: uuid
        toUserId:
          type: string
          format: uuid
          nullable: true
        toEmail:
          type: string
          format: email
          nullable: true
        transferToken:
          type: string
        status:
          type: string
          enum: [PENDING, ACCEPTED, CANCELLED, EXPIRED]
        message:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    TicketResale:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        sellerUserId:
          type: string
          format: uuid
        buyerUserId:
          type: string
          format: uuid
          nullable: true
        originalPrice:
          type: number
          format: decimal
        resalePrice:
          type: number
          format: decimal
        platformFee:
          type: number
          format: decimal
          description: 10% platform fee
        sellerPayout:
          type: number
          format: decimal
        status:
          type: string
          enum: [LISTED, SOLD, CANCELLED]
        notes:
          type: string
          nullable: true
        listedAt:
          type: string
          format: date-time
        soldAt:
          type: string
          format: date-time
          nullable: true

    DigitalWallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        autoAddTickets:
          type: boolean
          description: Automatically add new tickets
        backupEnabled:
          type: boolean
          description: Enable backup codes
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        walletTickets:
          type: array
          items:
            $ref: '#/components/schemas/WalletTicket'

    WalletTicket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        backupCode:
          type: string
          description: Manual entry code (format WLT-{regId8}-{timestamp36})
        isActive:
          type: boolean
        passData:
          type: object
          nullable: true
          description: Apple/Google pass data
        lastAccessedAt:
          type: string
          format: date-time
          nullable: true
        addedAt:
          type: string
          format: date-time

    # Payment Plan Schemas
    PaymentPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        planName:
          type: string
          example: "Monthly Payment Plan"
        totalAmount:
          type: number
          format: decimal
        currency:
          type: string
          example: "NGN"
        installmentCount:
          type: integer
          minimum: 2
        installmentAmount:
          type: number
          format: decimal
        frequency:
          type: string
          enum: [MONTHLY, WEEKLY, BIWEEKLY, CUSTOM]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum: [ACTIVE, COMPLETED, CANCELLED, DEFAULTED]
        autoPaymentEnabled:
          type: boolean
        paymentMethod:
          type: string
          nullable: true
        installments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInstallment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentInstallment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        installmentNumber:
          type: integer
          minimum: 1
        amount:
          type: number
          format: decimal
        currency:
          type: string
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum: [PENDING, PAID, OVERDUE, CANCELLED]
        paidAmount:
          type: number
          format: decimal
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        paymentTransactionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoiceNumber:
          type: string
          example: "INV-2024-0001"
        transactionId:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        totalAmount:
          type: number
          format: decimal
        subtotal:
          type: number
          format: decimal
        taxAmount:
          type: number
          format: decimal
        currency:
          type: string
          example: "NGN"
        status:
          type: string
          enum: [DRAFT, PENDING, SENT, PAID, OVERDUE, CANCELLED]
        billToName:
          type: string
        billToEmail:
          type: string
          format: email
        billToAddress:
          type: string
          nullable: true
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        sentAt:
          type: string
          format: date-time
          nullable: true
        sentTo:
          type: string
          nullable: true
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              description:
                type: string
              quantity:
                type: integer
              unitPrice:
                type: number
                format: decimal
              totalPrice:
                type: number
                format: decimal
        event:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Badge Template Schemas
    BadgeElement:
      type: object
      required:
        - id
        - type
        - content
        - x
        - y
        - width
        - height
        - zIndex
      properties:
        id:
          type: string
          description: Unique element identifier
        type:
          type: string
          enum: [text, image, qr, shape, logo, barcode, ribbon]
          description: Element type
        content:
          type: string
          description: Element content (can include template variables like {{fullName}})
        x:
          type: number
          description: X position in millimeters
        y:
          type: number
          description: Y position in millimeters
        width:
          type: number
          description: Width in millimeters
        height:
          type: number
          description: Height in millimeters
        fontSize:
          type: number
          nullable: true
          description: Font size for text elements
        fontFamily:
          type: string
          nullable: true
          description: Font family for text elements
        fontWeight:
          type: string
          enum: [normal, bold, light]
          nullable: true
        textAlign:
          type: string
          enum: [left, center, right]
          nullable: true
        color:
          type: string
          nullable: true
          description: Text or foreground color (hex format)
        backgroundColor:
          type: string
          nullable: true
          description: Background color (hex format)
        borderRadius:
          type: number
          nullable: true
          description: Border radius in pixels
        opacity:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        rotation:
          type: number
          nullable: true
          description: Rotation angle in degrees
        zIndex:
          type: integer
          description: Layer order (higher = on top)
        isVisible:
          type: boolean
          nullable: true
        isLocked:
          type: boolean
          nullable: true
        ribbonIcon:
          type: string
          enum: [crown, star, check-circle, award, badge, none]
          nullable: true
          description: Icon for ribbon elements
        ribbonGradient:
          type: string
          nullable: true
          description: CSS gradient string for ribbon background

    BadgeTemplate:
      type: object
      required:
        - id
        - name
        - width
        - height
        - sizePreset
        - orientation
        - backgroundColor
        - elements
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Template name
        description:
          type: string
          nullable: true
          description: Template description
        width:
          type: number
          description: Badge width in millimeters
          example: 101.6
        height:
          type: number
          description: Badge height in millimeters
          example: 76.2
        sizePreset:
          type: string
          enum: [4x3, 3.5x2.25, 4x6, A6, custom]
          description: Preset badge size
        orientation:
          type: string
          enum: [portrait, landscape]
        backgroundColor:
          type: string
          description: Background color (hex format)
          example: "#ffffff"
        backgroundImage:
          type: string
          nullable: true
          description: URL to background image (Cloudinary)
        elements:
          type: array
          items:
            $ref: '#/components/schemas/BadgeElement'
        isDefault:
          type: boolean
          description: Whether this is the default template
        isActive:
          type: boolean
          description: Whether the template is active
        organizerId:
          type: string
          format: uuid
          nullable: true
        eventId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FacilityZone:
      type: object
      required:
        - id
        - eventId
        - name
        - code
        - currentOccupancy
        - isActive
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        name:
          type: string
          description: Zone display name
          example: "VIP Lounge"
        code:
          type: string
          description: Unique zone code (max 10 chars)
          example: "VIP"
        description:
          type: string
          nullable: true
          description: Zone description
        maxCapacity:
          type: integer
          nullable: true
          description: Maximum simultaneous occupancy (null = unlimited)
          example: 100
        currentOccupancy:
          type: integer
          description: Current number of people in zone
          example: 25
        accessStart:
          type: string
          format: date-time
          nullable: true
          description: Zone opening time
        accessEnd:
          type: string
          format: date-time
          nullable: true
          description: Zone closing time
        isActive:
          type: boolean
          description: Whether the zone is active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FacilityZoneMapping:
      type: object
      properties:
        id:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        facility:
          type: object
          properties:
            id:
              type: string
            name:
              type: string

    AttendeeZoneAccess:
      type: object
      required:
        - id
        - registrationId
        - zoneId
        - grantedBy
        - isActive
      properties:
        id:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        accessCount:
          type: integer
          description: Number of times accessed
        lastAccessAt:
          type: string
          format: date-time
          nullable: true

    ZoneCapacityInfo:
      type: object
      properties:
        currentOccupancy:
          type: integer
          example: 75
        maxCapacity:
          type: integer
          nullable: true
          example: 100
        availableCapacity:
          type: integer
          nullable: true
          example: 25
        isFull:
          type: boolean
          example: false
        percentFull:
          type: integer
          description: Percentage of capacity used (0-100)
          example: 75

    FacilityMovement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        fromZoneId:
          type: string
          format: uuid
          nullable: true
        toZoneId:
          type: string
          format: uuid
        movementType:
          type: string
          enum: [entry, zone_change, exit]
        sequenceNumber:
          type: integer
          description: Movement sequence (1, 2, 3...)
        scannedAt:
          type: string
          format: date-time
        scannedBy:
          type: string
          format: uuid

    Printer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          description: User-friendly printer name
        driver:
          type: string
          enum: [cups, windows, printnode]
          description: Printer driver type
        deviceId:
          type: string
          description: System printer name or cloud ID
        host:
          type: string
          nullable: true
          description: Network printer host
        port:
          type: integer
          nullable: true
          description: Network printer port
        apiKey:
          type: string
          nullable: true
          description: PrintNode API key for cloud printing
        supportedSizes:
          type: array
          items:
            type: string
          description: Supported paper sizes
        paperSize:
          type: string
          description: Default paper size
        orientation:
          type: string
          enum: [portrait, landscape]
          description: Default orientation
        isOnline:
          type: boolean
          description: Current online status
        isActive:
          type: boolean
          description: Whether printer is active (not soft-deleted)
        lastChecked:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    PrinterConfig:
      type: object
      required:
        - name
        - driver
        - deviceId
      properties:
        name:
          type: string
          description: User-friendly printer name
          minLength: 1
          maxLength: 100
        driver:
          type: string
          enum: [cups, windows, printnode]
          description: Printer driver type
        deviceId:
          type: string
          description: System printer name or cloud ID
        host:
          type: string
          description: Network printer host
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Network printer port
        apiKey:
          type: string
          description: PrintNode API key (required for PrintNode driver)
        supportedSizes:
          type: array
          items:
            type: string
          default: ['4x3', 'A6']
          description: Supported paper sizes
        paperSize:
          type: string
          default: '4x3'
          description: Default paper size
        orientation:
          type: string
          enum: [portrait, landscape]
          default: landscape
          description: Default orientation
        eventId:
          type: string
          format: uuid
          description: Link printer to specific event (optional)

    PrinterStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isOnline:
          type: boolean
          description: Whether printer is currently online
        driver:
          type: string
          enum: [cups, windows, printnode]
        lastChecked:
          type: string
          format: date-time
          nullable: true

    PrintJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        printerId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, printing, completed, failed, cancelled]
          description: Current job status
        priority:
          type: integer
