  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: |
        Get a new access token using the refresh token stored in an HttpOnly cookie.
        The refresh token is automatically sent via the `refreshToken` cookie set during login.
        The old refresh token is revoked and a new one is issued (token rotation).
      operationId: refreshToken
      parameters:
        - name: refreshToken
          in: cookie
          required: true
          schema:
            type: string
          description: HttpOnly cookie containing the refresh token (set automatically by login/register)
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          expiresIn:
                            type: integer

