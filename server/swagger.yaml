                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          capacity:
                            $ref: '#/components/schemas/ZoneCapacityInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /events/{eventId}/movements:
    get:
      tags:
        - Service Point
      summary: Get event movements
      description: Get attendee movement history for an event
      operationId: getEventMovements
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: zoneId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Movements retrieved successfully
          content:
            application/json:
              schema:
                allOf:
