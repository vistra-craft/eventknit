                printerId:
                  type: string
                  description: ID of the printer to use
                templateId:
                  type: string
                  description: ID of the badge template
                registrationIds:
                  type: array
                  items:
                    type: string
                  description: Array of registration IDs
                copies:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 10
                priority:
                  type: integer
                  default: 0
      responses:
