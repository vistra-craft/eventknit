        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # Career Inquiry Endpoints
  /careers:
    post:
      tags:
        - Careers
      summary: Submit career inquiry
      description: |
        Submit a career inquiry by providing an email address.
        An automated email will be sent with instructions for the candidate to share their story.
        Rate limited to one submission per email per 24 hours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: candidate@example.com
                  description: Candidate's email address
                source:
                  type: string
                  maxLength: 100
                  example: linkedin
                  description: Optional tracking source
      responses:
        '201':
          description: Career inquiry submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Thank you for your interest! Check your email for next steps.
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: candidate@example.com
        '400':
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Careers
      summary: List career inquiries (Admin)
      description: Get all career inquiries with pagination and filtering. Requires admin privileges.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONTACTED, RESPONDED, REVIEWING, REJECTED, HIRED]
          description: Filter by inquiry status
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: List of career inquiries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      inquiries:
                        type: array
                        items:
                          $ref: '#/components/schemas/CareerInquiry'
                      pagination:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /careers/{id}:
    patch:
      tags:
        - Careers
      summary: Update career inquiry (Admin)
      description: Update the status and notes of a career inquiry. Requires admin privileges.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Career inquiry ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [PENDING, CONTACTED, RESPONDED, REVIEWING, REJECTED, HIRED]
                  description: New inquiry status
                notes:
                  type: string
                  maxLength: 5000
                  description: Internal notes about the candidate
      responses:
        '200':
          description: Inquiry updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Inquiry updated successfully
                  data:
                    $ref: '#/components/schemas/CareerInquiry'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==================== SERVICE POINT REGISTRATION ====================
  /events/{eventId}/service-point/initiate:
    post:
      tags:
        - Service Point
      summary: Initiate service point registration
      description: |
        Start registration process by sending OTP to attendee's phone.
        Rate limited to 30 requests per minute per user.
        Requires TELLER role or higher.
      operationId: initiateServicePointRegistration
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Event ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
              properties:
                phoneNumber:
                  type: string
                  example: "+254712345678"
                  description: Attendee phone number (E.164 format)
                facilityId:
                  type: string
                  format: uuid
                  description: Optional facility/service point ID
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sessionId:
                        type: string
                        format: uuid
                        description: Session ID for subsequent operations
                      otpSent:
                        type: boolean
                        example: true
                      expiresAt:
                        type: string
                        format: date-time
                        description: OTP expiration time
                      message:
                        type: string
                        example: "OTP sent to attendee phone"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          description: Too many registration requests

  /events/{eventId}/service-point/verify:
    post:
      tags:
        - Service Point
      summary: Verify OTP code
      description: |
        Verify the OTP code provided by the attendee.
        Rate limited to 10 attempts per minute per session.
        Requires TELLER role or higher.
      operationId: verifyServicePointOTP
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - otp
              properties:
                sessionId:
                  type: string
                  format: uuid
                  description: Session ID from initiate response
                otp:
                  type: string
                  pattern: "^[0-9]{4}$"
                  description: 4-digit OTP code
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      verified:
                        type: boolean
                        example: true
                      sessionId:
                        type: string
                      phoneNumber:
                        type: string
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Too many verification attempts

  /events/{eventId}/service-point/complete:
    post:
      tags:
        - Service Point
      summary: Complete registration
      description: |
        Complete registration with attendee details after OTP verification.
        Requires TELLER role or higher.
      operationId: completeServicePointRegistration
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
              properties:
                sessionId:
                  type: string
                  format: uuid
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                company:
                  type: string
                industry:
                  type: string
                jobTitle:
                  type: string
                ticketTypeId:
                  type: string
                  format: uuid
                registrationData:
                  type: object
                  description: Additional custom registration fields
      responses:
        '201':
          description: Registration completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      registrationId:
                        type: string
                      attendeeName:
                        type: string
                      email:
                        type: string
                      ticketType:
                        type: string
                      backupCode:
                        type: string
                        description: Backup code for ticket retrieval
                      qrCodeDataUrl:
                        type: string
                        description: Base64 encoded QR code image
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /events/{eventId}/service-point/session/{sessionId}:
    get:
      tags:
        - Service Point
      summary: Get session status
      description: Get the current status of a registration session
      operationId: getServicePointSessionStatus
