          description: Bulk print jobs created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          successCount:
                            type: integer
                          failureCount:
                            type: integer
                          total:
                            type: integer
                          jobs:
                            type: array
                            items:
                              $ref: '#/components/schemas/PrintJob'
                          errors:
                            type: array
                            items:
                              type: object
                              properties:
                                registrationId:
                                  type: string
                                error:
                                  type: string
        '400':
