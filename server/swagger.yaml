                    properties:
                      data:
                        type: object
                        properties:
                          jobs:
                            type: array
                            items:
                              $ref: '#/components/schemas/PrintJob'
                          total:
                            type: integer
                          page:
                            type: integer
                          limit:
                            type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /print-jobs/bulk:
    post:
      tags:
        - Service Point
      summary: Bulk create print jobs
      description: Create multiple print jobs for multiple attendees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - printerId
                - templateId
                - registrationIds
