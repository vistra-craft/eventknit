services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: eventknit-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventknit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eventknit}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eventknit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventknit} -d ${POSTGRES_DB:-eventknit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: eventknit-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - eventknit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Backend Server (Production)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: eventknit-server
    restart: always
    env_file: ./.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventknit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eventknit}?schema=public
      REDIS_URL: redis://redis:6379
    networks:
      - eventknit-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Client (Production — static build served by nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: eventknit-client
    restart: always
    networks:
      - eventknit-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: eventknit-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - eventknit-network
    depends_on:
      - server
      - client

networks:
  eventknit-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
